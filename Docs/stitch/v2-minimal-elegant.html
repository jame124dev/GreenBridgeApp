<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>AI Scan &amp; List - Minimal Elegant</title>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

                    "outline-variant": "#c4c6d0",
                    "background": "#faf9fd",
                    "tertiary-fixed": "#ffdbcb",
                    "on-error-container": "#93000a",
                    "outline": "#747780",
                    "surface-dim": "#dad9de",
                    "on-tertiary": "#ffffff",
                    "on-secondary": "#ffffff",
                    "auction-gold": "#C5A059",
                    "on-tertiary-fixed-variant": "#703718",

                    "error": "#ba1a1a",
                    "industrial-gray": "#F4F7F6",
                    "on-secondary-container": "#007257",
                    "primary-fixed-dim": "#aac7fd",
                    "surface-container": "#eeedf2",

                    "secondary": "#006c52",

            "borderRadius": {
                    "DEFAULT": "0.125rem",
                    "lg": "0.25rem",
                    "xl": "0.5rem",
                    "full": "0.75rem"

            "spacing": {
                    "stack-lg": "32px",

<style>
        @keyframes blob {
            0% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(20px, -30px) scale(1.05); }
            66% { transform: translate(-15px, 15px) scale(0.95); }
            100% { transform: translate(0px, 0px) scale(1); }
        }
        .animate-blob { animation: blob 8s infinite alternate ease-in-out; }
        .animation-delay-2000 { animation-delay: 2s; }

        .fade-in-up {
            opacity: 0;
            transform: translateY(15px);
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes fadeInUp {
            to { opacity: 1; transform: translateY(0); }
        }
        .stagger-1 { animation-delay: 0.1s; }
        .stagger-2 { animation-delay: 0.3s; }
        .stagger-3 { animation-delay: 0.5s; }

        .crossfade-container { position: relative; height: 36px; overflow: hidden; }
        .crossfade-text {
            position: absolute; width: 100%; top: 0; left: 0;
            opacity: 0; transition: opacity 1.2s ease-in-out;
        }
        .crossfade-text.active { opacity: 1; }
        
        .smooth-shadow { box-shadow: 0 4px 20px rgba(0, 40, 85, 0.04); }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface font-body-sm h-[884px] overflow-hidden flex flex-col relative w-full max-w-md mx-auto border-x border-outline-variant/30">
<!-- Background Blob -->
<div class="absolute inset-0 overflow-hidden pointer-events-none z-0 bg-surface">
<div class="absolute top-1/4 left-1/2 -translate-x-1/2 w-64 h-64 bg-secondary-fixed rounded-full mix-blend-multiply filter blur-[80px] opacity-20 animate-blob"></div>
<div class="absolute top-1/3 right-1/4 w-72 h-72 bg-eco-teal rounded-full mix-blend-multiply filter blur-[90px] opacity-10 animate-blob animation-delay-2000"></div>
</div>
<!-- TopAppBar Component -->
<header class="bg-surface dark:bg-surface-dim text-primary dark:text-primary-fixed-dim border-b border-outline-variant dark:border-outline flex justify-between items-center px-margin-mobile h-16 w-full z-50 relative bg-opacity-80 backdrop-blur-md">
<button class="hover:bg-surface-container-low dark:hover:bg-surface-container-high transition-colors active:scale-95 duration-150 p-2 rounded-full flex items-center justify-center text-primary">
<span class="material-symbols-outlined">precision_manufacturing</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-primary dark:text-primary-fixed tracking-tight">AI Scan &amp; List</h1>
<button class="hover:bg-surface-container-low dark:hover:bg-surface-container-high transition-colors active:scale-95 duration-150 p-2 rounded-full flex items-center justify-center text-primary">
<span class="material-symbols-outlined">settings</span>
</button>
</header>
<!-- Main Scanner Canvas -->
<main class="flex-1 flex flex-col items-center justify-center px-margin-mobile relative z-10 pb-20 w-full">
<!-- Large Minimal Confidence Ring -->
<div class="flex flex-col items-center justify-center mb-stack-lg mt-8">
<div class="relative flex items-center justify-center w-56 h-56 rounded-full">
<!-- Subtle pulsing ring behind -->
<div class="absolute inset-0 rounded-full border border-secondary-fixed/30 animate-[ping_3s_cubic-bezier(0,0,0.2,1)_infinite] opacity-50"></div>
<div class="absolute inset-4 rounded-full border border-secondary-fixed/50"></div>
<div class="flex items-baseline text-primary">
<span class="font-headline-xl text-[80px] font-bold tracking-tighter leading-none">90</span>
<span class="font-headline-lg text-headline-lg text-outline ml-1">%</span>
</div>
</div>
</div>
<!-- Crossfading Phase Text -->
<div class="text-center w-full mb-stack-lg">
<div class="crossfade-container font-headline-lg-mobile text-headline-lg-mobile text-primary font-semibold tracking-tight" id="phase-container">
<div class="crossfade-text active">Analyzing Matrix...</div>
<div class="crossfade-text">Extracting Specs...</div>
<div class="crossfade-text">Finalizing Listing...</div>
</div>
</div>
<!-- Ultra-Minimal Product Rows -->
<div class="w-full flex flex-col gap-stack-sm">
<div class="fade-in-up stagger-1 bg-surface-container-lowest/80 backdrop-blur-sm border border-outline-variant/50 rounded-xl p-4 flex justify-between items-center smooth-shadow">
<div class="flex flex-col">
<span class="font-body-md text-body-md text-on-surface font-medium">Siemens 3-Phase Motor</span>
<span class="font-label-caps text-label-caps text-outline">Industrial Grade</span>
</div>
<span class="material-symbols-outlined text-secondary-container" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<div class="fade-in-up stagger-2 bg-surface-container-lowest/80 backdrop-blur-sm border border-outline-variant/50 rounded-xl p-4 flex justify-between items-center smooth-shadow">
<div class="flex flex-col">
<span class="font-body-md text-body-md text-on-surface font-medium">Steel Housing Enclosure</span>
<span class="font-label-caps text-label-caps text-outline">IP65 Rated</span>
</div>
<span class="material-symbols-outlined text-secondary-container" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<div class="fade-in-up stagger-3 bg-surface-container-lowest/40 backdrop-blur-sm border border-outline-variant/30 rounded-xl p-4 flex justify-between items-center opacity-70">
<div class="flex flex-col">
<span class="font-body-md text-body-md text-on-surface-variant font-medium">Market Value Estimation</span>
<span class="font-label-caps text-label-caps text-outline">Checking History...</span>
</div>
<span class="material-symbols-outlined text-primary-container animate-spin">progress_activity</span>
</div>
</div>
</main>
<!-- BottomNavBar Component -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-2 pb-safe bg-surface dark:bg-surface-dim h-20 border-t border-outline-variant dark:border-outline max-w-md mx-auto">
<button class="flex flex-col items-center justify-center bg-secondary-container dark:bg-secondary text-on-secondary-container dark:text-on-secondary rounded-full px-4 py-1 hover:text-primary dark:hover:text-primary-fixed transition-colors active:scale-90 duration-200">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">barcode_scanner</span>
<span class="font-label-caps text-label-caps mt-1">Scan</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant px-4 py-1 hover:text-primary dark:hover:text-primary-fixed transition-colors active:scale-90 duration-200">
<span class="material-symbols-outlined">inventory_2</span>
<span class="font-label-caps text-label-caps mt-1">Inventory</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant px-4 py-1 hover:text-primary dark:hover:text-primary-fixed transition-colors active:scale-90 duration-200">
<span class="material-symbols-outlined">gavel</span>
<span class="font-label-caps text-label-caps mt-1">Bids</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant px-4 py-1 hover:text-primary dark:hover:text-primary-fixed transition-colors active:scale-90 duration-200">
<span class="material-symbols-outlined">person</span>
<span class="font-label-caps text-label-caps mt-1">Profile</span>
</button>
</nav>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const texts = document.querySelectorAll('.crossfade-text');
            let currentIndex = 0;

            setInterval(() => {
                texts[currentIndex].classList.remove('active');
                currentIndex = (currentIndex + 1) % texts.length;
                texts[currentIndex].classList.add('active');
            }, 3000);
        });
    </script>
</body></html>
